[package]
name = "memleash"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Control Windows process working-set limits by application profile"
keywords = ["windows", "win32", "memory", "working-set", "process"]
categories = ["os::windows-apis", "memory-management"]

[dependencies]
memleash-profiles = { path = "crates/memleash-profiles" }
memleash-win32 = { path = "crates/memleash-win32" }

[workspace]
resolver = "2"
members = ["crates/memleash-profiles", "crates/memleash-win32"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/yanlvl99/memleash"

[workspace.dependencies]
thiserror = "2"
windows = { version = "0.62", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }
